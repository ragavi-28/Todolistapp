[project]
name = "fastapi-task-manager"
version = "1.0.0"
description = "FastAPI Task Management Application with Authentication"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "passlib>=1.7.4",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aio-pika>=9.0.0",
    "pika>=1.4.4",
]

[tool.uv]
package = false
